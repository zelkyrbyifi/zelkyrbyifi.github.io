<head>

  <style>
    /* ── Team page layout ── */
    .team-page {
      padding: 1.5rem 0 4rem;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 2rem;
      margin-top: 1rem;
    }

    /* ── Individual card ── */
    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.8rem;
    }

    .team-portrait {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border2);
      background: #0e0b07;
      overflow: hidden;
    }

    .team-portrait::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid var(--border);
      pointer-events: none;
      z-index: 2;
    }

    .team-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Placeholder when no image */
    .team-portrait-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border2);
    }

    .team-name {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--gold2);
      letter-spacing: 0.06em;
      line-height: 1.3;
    }

    .team-role {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .team-link {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--border2);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .team-link:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    @media (max-width: 640px) {
      .team-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.2rem;
      }
      .team-card {
        width: 100%;
      }
      .team-portrait {
        width: 100%;
        aspect-ratio: 1 / 1;
      }
    }
  </style>

  <style id="lang-style">
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      position: fixed;
      top: 1rem;
      right: 1.5rem;
      z-index: 400;
    }
    @media (max-width: 640px) {
      #lang-toggle {
        position: static;
        justify-content: flex-end;
        padding: 0.5rem 0 0;
      }
    }
    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.3rem 0.4rem;
      border-radius: 2px;
      transition: color 0.2s, background 0.2s;
      color: var(--muted);
    }
    .lang-btn.active {
      color: var(--gold);
      background: #1a130d;
      border: 1px solid var(--border2);
    }
    .lang-btn:hover:not(.active) { color: var(--text); }
    .lang-sep { color: var(--border2); font-size: 0.5rem; }
  </style>
</head>
<body>


  <!-- Language toggle -->
  <div id="lang-toggle">
    <button class="lang-btn" id="btn-en" onclick="switchLang('en')">EN</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn" id="btn-ua" onclick="switchLang('ua')">UA</button>
  </div>

  <canvas id="border-left" class="border-canvas border-side border-left"></canvas>
  <canvas id="border-right" class="border-canvas border-side border-right"></canvas>

  <div class="site-wrap">

    <div class="chapter-back" style="padding: 2rem 0 0;">
      <a href="index.html">← Zelkyr</a>
    </div>

    <div class="ornament-bar" style="margin-top:1rem;">
      <canvas id="orn-bar" width="640" height="28"></canvas>

    <header class="chapter-header">

    </footer>

  </div>

  <canvas id="border-bottom" class="border-canvas border-bottom"></canvas>

  <script>
    (function() {
      var LANG_MAP = {
        'index.html':         'index-ua.html',
        'gemstones.html':     'gemstones-ua.html',
        'characters.html':    'characters-ua.html',
        'team.html':          'team-ua.html',
        'index-ua.html':      'index.html',
        'gemstones-ua.html':  'gemstones.html',
        'characters-ua.html': 'characters.html',
        'team-ua.html':       'team.html',
      };

      function getCurrentPage() {
        var path = window.location.pathname;
        return path.substring(path.lastIndexOf('/') + 1) || 'index.html';
      }

      function isUAPage() {
        return getCurrentPage().endsWith('-ua.html') ||
               getCurrentPage().includes('-ua/');
      }

      window.switchLang = function(lang) {
        localStorage.setItem('zelkyr-lang', lang);
        var page = getCurrentPage();
        var dest;
        if (page.includes('chapter-')) {
          dest = lang === 'ua'
            ? page.replace(/(-ua)?\.html$/, '-ua.html')
            : page.replace('-ua.html', '.html');
        } else {
          dest = lang === 'ua'
            ? (LANG_MAP[page] && LANG_MAP[page].endsWith('-ua.html') ? LANG_MAP[page] : page.replace('.html', '-ua.html'))
            : (LANG_MAP[page] && !LANG_MAP[page].endsWith('-ua.html') ? LANG_MAP[page] : page.replace('-ua.html', '.html'));
        }
        if (dest && dest !== page) window.location.href = dest;
      };

      // Set active button
      var ua = isUAPage();
      var btnEn = document.getElementById('btn-en');
      var btnUa = document.getElementById('btn-ua');
      if (btnEn) btnEn.classList.toggle('active', !ua);
      if (btnUa) btnUa.classList.toggle('active', ua);

      // Auto-redirect based on saved language — use flag to prevent loops
      var saved = localStorage.getItem('zelkyr-lang');
      if (saved && !sessionStorage.getItem('lang-redirected')) {
        var ua = isUAPage();
        if (saved === 'ua' && !ua) {
          sessionStorage.setItem('lang-redirected', '1');
          switchLang('ua');
        } else if (saved === 'en' && ua) {
          sessionStorage.setItem('lang-redirected', '1');
          switchLang('en');
        }
      }
    })();
  </script>
</body>
