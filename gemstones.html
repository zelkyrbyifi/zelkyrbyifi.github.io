    .gemstone-page {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      padding: 2rem 0 4rem;
      align-items: start;
    }

    /* ── Sidebar ── */
    .school-sidebar { position: sticky; top: 2rem; }


    .sidebar-label {
      font-family: var(--font-heading);
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border2);
    }

    .school-group { margin-bottom: 1.2rem; }

    .school-group-label {
      font-family: var(--font-heading);
      font-size: 0.52rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.3rem;
      padding-left: 0.2rem;
    }

    .school-list { list-style: none; }
    .school-list li { border-bottom: 1px solid var(--border); }

    .school-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.45rem 0.4rem;
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      transition: color 0.2s, padding-left 0.2s, background 0.2s;
      line-height: 1.3;
    }

    .school-btn:hover { color: var(--text); padding-left: 0.7rem; background: #1a130d; }
    .school-btn.active { color: var(--gold); padding-left: 0.7rem; background: #1a130d; }
    .school-btn.active::before { content: '✦ '; font-size: 0.45rem; vertical-align: middle; color: var(--gold); }

    /* ── Main area ── */
    .altar-area { display: flex; flex-direction: column; align-items: stretch; gap: 1.5rem; }

    .altar-frame {
      position: relative;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 8 / 9;
      border: 1px solid var(--border2);
      background: #0e0b07;
      overflow: hidden;
    }

    .altar-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #c8923a08 0%, transparent 30%), linear-gradient(to top, #c8923a06 0%, transparent 30%);
      pointer-events: none;
      z-index: 3;
    }

    .altar-frame::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid var(--border);
      pointer-events: none;
      z-index: 3;
    }

    .altar-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    .altar-base { z-index: 1; opacity: 1; }
    .altar-overlay { z-index: 2; opacity: 0; pointer-events: none; }
    .altar-overlay.visible { opacity: 1; }

    .altar-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 1;
    }

    .altar-placeholder-text {
      font-family: var(--font-heading);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border2);
      text-align: center;
      padding: 0 2rem;
      line-height: 2;
    }

    .gem-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .gem-placeholder.visible { opacity: 1; }

    /* ── Info panel below altar ── */
    .school-info {
      width: 100%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .school-info.visible { opacity: 1; transform: translateY(0); }

    .info-header {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border2);
      margin-bottom: 0.8rem;
    }

    .info-school-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--gold2);
      letter-spacing: 0.06em;
    }

    .info-sub {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tier-list { list-style: none; }

    .tier-row {
      display: grid;
      grid-template-columns: 3.5rem 1px 1fr;
      gap: 0.8rem;
      align-items: baseline;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);

    .tier-label {
      font-family: var(--font-heading);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: right;

    .tier-gem { font-style: italic; color: var(--text); }
    .tier-desc { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 0.1rem; line-height: 1.5; }

      color: var(--muted);
      padding-top: 0.6rem;
      border-top: 1px solid var(--border);
      line-height: 1.6;
    }

    function drawGem(canvas, color) {
      const DPR = window.devicePixelRatio || 1;
      const S = 120;
      canvas.width = S*DPR; canvas.height = S*DPR;
      canvas.style.width = S+'px'; canvas.style.height = S+'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(DPR, DPR);
      const cx = S/2, cy = S/2;
      const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,52);
      glow.addColorStop(0, color+'44'); glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow; ctx.fillRect(0,0,S,S);
      const pts=[];
      for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2-Math.PI/8;pts.push([cx+Math.cos(a)*38,cy+Math.sin(a)*38]);}
      ctx.beginPath();pts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));ctx.closePath();
      const fill=ctx.createLinearGradient(cx,cy-38,cx,cy+38);
      fill.addColorStop(0,color+'cc');fill.addColorStop(0.5,color+'aa');fill.addColorStop(1,color+'66');
      ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle=color;ctx.lineWidth=1;ctx.globalAlpha=0.7;ctx.stroke();ctx.globalAlpha=1;
      [0,2,4,6].forEach(i=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(pts[i][0],pts[i][1]);ctx.strokeStyle='#ffffff';ctx.lineWidth=0.5;ctx.globalAlpha=0.2;ctx.stroke();ctx.globalAlpha=1;});
      ctx.beginPath();ctx.ellipse(cx-10,cy-12,8,5,-Math.PI/4,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.globalAlpha=0.35;ctx.fill();ctx.globalAlpha=1;
    }

    function drawAltarStar() {
      const canvas = document.getElementById('cAltarStar');
      if (!canvas) return;
      const DPR = window.devicePixelRatio || 1;
      const S = 80;
      canvas.width=S*DPR;canvas.height=S*DPR;canvas.style.width=S+'px';canvas.style.height=S+'px';
      const ctx=canvas.getContext('2d');ctx.scale(DPR,DPR);
      const cx=S/2,cy=S/2;
      ctx.beginPath();
      for(let i=0;i<16;i++){const a=(i*Math.PI)/8-Math.PI/2;const r=i%2===0?32:14;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.closePath();ctx.strokeStyle='#4a3520';ctx.lineWidth=1;ctx.stroke();
    }

    function buildOverlays() {
      const container = document.getElementById('overlayContainer');
      Object.keys(SCHOOLS).forEach(school => {
        const img = document.createElement('img');
        img.className = 'altar-img altar-overlay';
        img.id = 'overlay-' + school;
        img.src = 'images/gem-' + school.toLowerCase().replace(/[^a-z]/g,'') + '.png';
        img.alt = school;
        img.onerror = function() { this.style.display='none'; };
        container.appendChild(img);
      });
    }

    function renderInfo(school) {
      const data = SCHOOLS[school];
      if (!data) return;
      document.getElementById('infoName').textContent = school;
      document.getElementById('infoSub').textContent = data.sub || '';

      const list = document.getElementById('tierList');
      list.innerHTML = '';

      data.tiers.forEach(tier => {
        const li = document.createElement('li');
        li.className = 'tier-row';
        li.innerHTML = `
          <span class="tier-label" style="color:${data.color}">${tier.t}</span>
          <span class="tier-divider"></span>
          <span class="tier-content">
            <span class="tier-gem">${tier.gem}</span>
            <span class="tier-desc">${tier.desc}</span>
          </span>`;
        list.appendChild(li);
      });

      if (data.special) {
        const li = document.createElement('li');
        li.className = 'tier-row tier-special';
        li.innerHTML = `
          <span class="tier-label" style="color:#c49020">Special</span>
          <span class="tier-divider"></span>
          <span class="tier-content">
            <span class="tier-gem">${data.special.gem}</span>
            <span class="tier-desc">${data.special.desc}</span>
          </span>`;
        list.appendChild(li);
      }

      if (data.tiers.length === 0) {
        list.innerHTML = '<li style="padding:0.6rem 0;font-size:0.85rem;font-style:italic;color:var(--muted);">Gemstone tiers not yet documented.</li>';
      }

      const noteEl = document.getElementById('infoNote');
      if (data.note) {
        noteEl.textContent = data.note;
        noteEl.style.display = 'block';
      } else {
        noteEl.style.display = 'none';
      }

      document.getElementById('schoolInfo').classList.add('visible');
    }

    let activeSchool = null;

    function selectSchool(school) {
      document.querySelectorAll('.school-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.altar-overlay').forEach(o => o.classList.remove('visible'));

      if (activeSchool === school) {
        activeSchool = null;
        document.getElementById('gemPlaceholder').classList.remove('visible');
        document.getElementById('schoolInfo').classList.remove('visible');
        return;
      }

      activeSchool = school;
      const btn = document.querySelector(`[data-school="${school}"]`);
      if (btn) btn.classList.add('active');

      const overlay = document.getElementById('overlay-' + school);
      if (overlay && overlay.style.display !== 'none') {
        overlay.classList.add('visible');
        document.getElementById('gemPlaceholder').classList.remove('visible');
      } else {
        const gemCanvas = document.getElementById('cGemPreview');
        drawGem(gemCanvas, GEM_COLORS[school] || '#c8923a');
        document.getElementById('gemPlaceholder').classList.add('visible');
      }

      renderInfo(school);
    }

    document.querySelectorAll('.school-btn').forEach(btn => {
      btn.addEventListener('click', () => selectSchool(btn.dataset.school));
    });

    buildOverlays();
    drawAltarStar();
  </script>

</body>
</html>
