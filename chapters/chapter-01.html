<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter I · Zelkyr</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* ── Scene break ── */
    .scene-break {
      text-align: center;
      color: var(--gold-dim);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      margin: 2.5rem 0;
    }

    /* ── Chapter end divider ── */
    .chapter-end {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin: 3rem 0 2rem;
    }
    .chapter-end-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border2));
    }
    .chapter-end-line:last-child {
      background: linear-gradient(to left, transparent, var(--border2));
    }
    #chapter-end-star { opacity: 0.6; flex-shrink: 0; }

    .illus-word {
      color: var(--gold);
      border-bottom: 1px solid var(--gold-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .illus-word:hover { color: var(--gold2); }

    .illus-popup {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 0.25rem;
      animation: fadeIn 0.15s ease;
    }
    .illus-popup-icon {
      background: #12100c;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px 2px #c8923a44;
      transition: color 0.2s, border-color 0.2s;
    }
    .illus-popup-icon:hover { color: var(--gold2); border-color: var(--gold); }

    /* ── Image overlay ── */
    #illus-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(8,7,5,0.88);
      align-items: center;
      justify-content: center;
    }
    #illus-overlay.open { display: flex; }
    #illus-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 0 60px #00000099;
    }
    #illus-close {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 3;
      background: #12100c;
      border: 1px solid var(--border2);
      color: var(--muted);
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: color 0.2s, border-color 0.2s;
    }
    #illus-close:hover { color: var(--gold); border-color: var(--gold-dim); }
  </style>

  <style id="lang-style">
    #lang-toggle {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      position: fixed;
      top: 1rem;
      right: 1.5rem;
      z-index: 400;
    }
    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.3rem 0.4rem;
      border-radius: 2px;
      transition: color 0.2s, background 0.2s;
      color: var(--muted);
    }
    .lang-btn.active {
      color: var(--gold);
      background: #1a130d;
      border: 1px solid var(--border2);
    }
    .lang-btn:hover:not(.active) { color: var(--text); }
    .lang-sep { color: var(--border2); font-size: 0.5rem; }
  </style>
</head>
<body>


  <!-- Language toggle -->
  <div id="lang-toggle">
    <button class="lang-btn" id="btn-en" onclick="switchLang('en')">EN</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn" id="btn-ua" onclick="switchLang('ua')">UA</button>
  </div>

  <div class="grain"></div>
  <canvas id="border-top" class="border-canvas border-top"></canvas>

  <div class="site-wrap">

    <div class="chapter-back">
      <a href="../index.html">← Zelkyr</a>
    </div>

    <div class="ornament-bar" style="margin-top:1rem;">
      <canvas id="orn-bar" width="640" height="28"></canvas>
    </div>

    <header class="chapter-header">
      <div class="section-head">
        <span class="section-diamond"></span>
        <span class="section-label">Chapter I</span>
        <span class="section-diamond"></span>
      </div>
      <h1 class="chapter-title-large">Chapter I</h1>
    </header>

    <div class="ornament-bar ornament-bar--slim">
      <canvas id="orn-bar2" width="640" height="16"></canvas>
    </div>

    <div class="chapter-body">
      <p>COMINGS <span class="illus-word" data-img="../images/portrait-nestor.png">SOON</span>.
    </div>

    <div class="chapter-end">
      <span class="chapter-end-line"></span>
      <canvas id="chapter-end-star" width="40" height="40"></canvas>
      <span class="chapter-end-line"></span>
    </div>

    <nav class="chapter-footer-nav">
      <a href="../index.html#Read">← All chapters</a>
      <span></span>
    </nav>

    <footer class="site-footer">
      <canvas id="footer-star" width="40" height="40"></canvas>
      <p>&copy; <span id="yr"></span> &nbsp;·&nbsp; © 2026 Ifigeniya. All rights reserved. Zelkyr is a work of fiction. All characters and events are fictitious. Contains mature themes. Recommended for readers 18+. No part of this work may be reproduced without written permission. </p>
    </footer>

  </div>

  <canvas id="border-bottom" class="border-canvas border-bottom"></canvas>

  <script src="../ornaments.js"></script>
  <script>
    // Draw small eight-pointed star at chapter end
    (function() {
      var canvas = document.getElementById('chapter-end-star');
      if (!canvas) return;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = 40 * dpr; canvas.height = 40 * dpr;
      canvas.style.width = '40px'; canvas.style.height = '40px';
      var ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      var cx = 20, cy = 20;
      ctx.beginPath();
      for (var i = 0; i < 16; i++) {
        var angle = (i * Math.PI) / 8 - Math.PI / 2;
        var r = i % 2 === 0 ? 16 : 7;
        var x = cx + Math.cos(angle) * r;
        var y = cy + Math.sin(angle) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#c8923a';
      ctx.lineWidth = 0.9;
      ctx.globalAlpha = 0.7;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#e8b84a';
      ctx.globalAlpha = 0.8;
      ctx.fill();
    })();
  </script>



  </div>

  <!-- Image overlay — opened by clicking illustrated words -->
  <div id="illus-overlay">
    <button id="illus-close" onclick="closeIllus()" title="Close">&#x2715;</button>
    <img id="illus-img" src="" alt="" />
  </div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Scene break indentation
    document.querySelectorAll('.scene-break').forEach(function(br) {
      var next = br.nextElementSibling;
      if (next && next.tagName === 'P') next.style.textIndent = '2em';
    });

    // Illustrated hotword system
    var activePopup = null;

    function closeIllus() {
      document.getElementById('illus-overlay').classList.remove('open');
    }

    function removePopup() {
      if (activePopup) { activePopup.remove(); activePopup = null; }
    }

    document.querySelectorAll('.illus-word').forEach(function(word) {
      word.addEventListener('click', function(e) {
        e.stopPropagation();
        if (activePopup && activePopup.dataset.owner === word.dataset.img) {
          removePopup(); return;
        }
        removePopup();
        var popup = document.createElement('span');
        popup.className = 'illus-popup';
        popup.dataset.owner = word.dataset.img;
        var icon = document.createElement('button');
        icon.className = 'illus-popup-icon';
        icon.title = 'View illustration';
        icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
        icon.addEventListener('click', function(e) {
          e.stopPropagation();
          document.getElementById('illus-img').src = word.dataset.img;
          document.getElementById('illus-overlay').classList.add('open');
        });
        popup.appendChild(icon);
        word.insertAdjacentElement('afterend', popup);
        activePopup = popup;
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closeIllus(); removePopup(); }
    });

    // Remove popup when tapping anywhere outside the word or icon
    document.addEventListener('click', function(e) {
      if (activePopup && !e.target.closest('.illus-word') && !e.target.closest('.illus-popup')) {
        removePopup();
      }
    });
  </script>

  <script>
    (function() {
      var LANG_MAP = {
        'index.html':         'index-ua.html',
        'gemstones.html':     'gemstones-ua.html',
        'characters.html':    'characters-ua.html',
        'team.html':          'team-ua.html',
        'index-ua.html':      'index.html',
        'gemstones-ua.html':  'gemstones.html',
        'characters-ua.html': 'characters.html',
        'team-ua.html':       'team.html',
      };

      function getCurrentPage() {
        var path = window.location.pathname;
        return path.substring(path.lastIndexOf('/') + 1) || 'index.html';
      }

      function isUAPage() {
        return getCurrentPage().endsWith('-ua.html') ||
               getCurrentPage().includes('-ua/');
      }

      window.switchLang = function(lang) {
        localStorage.setItem('zelkyr-lang', lang);
        var page = getCurrentPage();
        var dest;
        if (page.includes('chapter-')) {
          dest = lang === 'ua'
            ? page.replace(/(-ua)?\.html$/, '-ua.html')
            : page.replace('-ua.html', '.html');
        } else {
          dest = lang === 'ua'
            ? (LANG_MAP[page] && LANG_MAP[page].endsWith('-ua.html') ? LANG_MAP[page] : page.replace('.html', '-ua.html'))
            : (LANG_MAP[page] && !LANG_MAP[page].endsWith('-ua.html') ? LANG_MAP[page] : page.replace('-ua.html', '.html'));
        }
        if (dest && dest !== page) window.location.href = dest;
      };

      // Set active button
      var ua = isUAPage();
      var btnEn = document.getElementById('btn-en');
      var btnUa = document.getElementById('btn-ua');
      if (btnEn) btnEn.classList.toggle('active', !ua);
      if (btnUa) btnUa.classList.toggle('active', ua);

      // Auto-redirect based on saved language — use flag to prevent loops
      var saved = localStorage.getItem('zelkyr-lang');
      if (saved && !sessionStorage.getItem('lang-redirected')) {
        var ua = isUAPage();
        if (saved === 'ua' && !ua) {
          sessionStorage.setItem('lang-redirected', '1');
          switchLang('ua');
        } else if (saved === 'en' && ua) {
          sessionStorage.setItem('lang-redirected', '1');
          switchLang('en');
        }
      }
    })();
  </script>
</body>
</html>
